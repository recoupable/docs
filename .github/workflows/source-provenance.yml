name: Documentation source provenance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Marketing revision
        id: source
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          commit = json.loads(Path('SOURCE-PROVENANCE.json').read_text())['commit']
          if not re.fullmatch('[0-9a-f]{40}', commit):
              raise SystemExit('Invalid Marketing commit pin')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('commit=' + commit + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: recoupable/marketing
          ref: ${{ steps.source.outputs.commit }}
          path: .documentation-source
      - run: python3 scripts/check_source.py --source .documentation-source
